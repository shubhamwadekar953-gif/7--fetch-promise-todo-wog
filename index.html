<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETCH PROMISE TODO CRUD WOG </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <h1 class = "h1 text-center text-white mb-5 p-2">FETCH PROMISE 7th TODO CRUD WOG</h1>
    <div class = "container-fluid">
        <div class = "row">

               <div class = "col-md-8">
                <div class = "card2">
                    <h3 class = "text-center text-white p-1">TODO LIST IN UI</h3>
                    <div class = "card-body">
                        <table class = "table table-bordered">
                            <thead class = "text-white">
                                <tr>
                                    <th>USER ID</th>
                                    <th>TODO NAME</th>
                                    <th>EDIT</th>
                                    <th>DELETE</th>
                                </tr>
                            </thead>

                            <tbody id = "todoList" class = "text-white">
                                <!-- <tr>
                                    <td>11</td>
                                    <td>angular</td>
                                    <td><button class = "btn btn-success btn-sm">Edit</button></td>
                                    <td> <button class = "btn btn-danger btn-sm">Remove </button></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>



            <div class = "col-md-4">
                <form id = "todoForm">
                    <div class = "card1">
                        <h3 class = " text-center text-white p1">ADD TODO</h3>
                        <div class = "card-body text-white">

                            <div class = "form-group mb-3">
                                <label for = "todoInput">User ID:</label>
                                <input type = "number" id = "userId" class = "form-control mb-3">
                            </div>


                            <div class = "form-group mb-5">
                                <label for = "todoInput">Enter your todo</label>
                                <input type = "text" id = "addTodo" class = "form-control mb-5">
                            </div>

                            
                            <button type = "submit" class = "btn btn-primary" id = "submitBtn">Submit</button>
                            <button type = "button" class = "btn btn-warning d-none" id = "updateBtn">Update</button>

                        
                        </div>
                    </div>
                </form>
            </div> 
        </div>
    </div>

     <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "app.js"></script>
</body>
</html>
